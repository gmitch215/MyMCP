name: mymcp-fixtures

services:
  echo:
    image: mccutchen/go-httpbin:2.25.0@sha256:20739736d4eb8dc1b998dff701f437b8bd62dcc46492bd0d861e89890ca36500
    ports:
      - '127.0.0.1:18081:8080'

  specs:
    image: nginx:1.31-alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    ports:
      - '127.0.0.1:18082:80'
    volumes:
      - ./specs:/usr/share/nginx/html:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/petstore.json >/dev/null || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30

name: mymcp-fixtures

services:
  echo:
    image: mccutchen/go-httpbin:2.26.0@sha256:873b4fdb27fe7cc66fa12cb9362574e1b0bf31df7ca8a71b2502988327a0b8a4
    ports:
      - '127.0.0.1:18081:8080'

  specs:
    image: nginx:1.31-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    ports:
      - '127.0.0.1:18082:80'
    volumes:
      - ./specs:/usr/share/nginx/html:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/petstore.json >/dev/null || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30

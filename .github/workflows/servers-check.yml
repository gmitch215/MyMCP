name: Servers Check

on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [master]
    paths:
      - 'src/servers.json'
      - 'scripts/check-servers.ts'
  pull_request:
    paths:
      - 'src/servers.json'
      - 'scripts/check-servers.ts'
  workflow_dispatch:

jobs:
  check:
    name: Validate servers.json
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check every preconfigured server
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 30
          command: bun run servers:check
